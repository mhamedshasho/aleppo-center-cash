name: Windows Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Windows application icon
        shell: pwsh
        run: |
          pnpm add -D sharp png-to-ico
          node --input-type=module -e "import fs from 'node:fs/promises'; import sharp from 'sharp'; import pngToIco from 'png-to-ico'; const png = await sharp('client/public/redro-mark.svg').resize(256,256).png().toBuffer(); await fs.mkdir('build',{recursive:true}); await fs.writeFile('build/icon.ico', await pngToIco([png]));"

      - name: Build Windows installer and portable app
        run: pnpm desktop:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aleppo-center-cash-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.exe
