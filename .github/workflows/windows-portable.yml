# Windows Portable Lite — hard limit: 100 MB\nname: Windows Portable Lite
# Portable build: Tauri + WebView2, no Electron runtime

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - .github/workflows/windows-exe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build lightweight portable EXE
        run: npx @tauri-apps/cli@2.8.5 build --no-bundle
      - name: Prepare release file
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/aleppo-center-cash.exe"
          if (!(Test-Path $source)) { throw "Portable EXE was not produced: $source" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $source "release/Aleppo.Center.Cash.Portable.1.0.3.exe"
      - name: Verify portable size
        shell: pwsh
        run: |
          $file = Get-Item "release/Aleppo.Center.Cash.Portable.1.0.3.exe"
          Write-Host "Portable EXE size: $($file.Length) bytes"
          if ($file.Length -ge 50000000) { throw "Portable EXE is unexpectedly large: $($file.Length) bytes" }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: aleppo-center-cash-portable-lite-${{ github.run_number }}
          path: release/Aleppo.Center.Cash.Portable.1.0.3.exe
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-v${{ github.run_number }}
          name: Aleppo Center Cash Portable v${{ github.run_number }}
          generate_release_notes: true
          files: release/Aleppo.Center.Cash.Portable.1.0.3.exe
