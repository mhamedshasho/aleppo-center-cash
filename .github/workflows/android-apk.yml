name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Initialize Capacitor
        run: pnpm exec cap init "Aleppo Center Cash" "com.shashocompany.aleppocentercash" --web-dir dist/public

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Configure Android to load the live web app
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";
          const config: CapacitorConfig = {
            appId: "com.shashocompany.aleppocentercash",
            appName: "Aleppo Center Cash",
            webDir: "dist/public",
            server: {
              url: "https://aleppo-center-cash.vercel.app/",
              cleartext: false
            }
          };
          export default config;
          EOF

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Add native Android PDF saver\n        working-directory: android\n        shell: bash\n        run: |\n          set -e\n          mkdir -p app/src/main/java/com/shashocompany/aleppocentercash\n          cat > app/src/main/java/com/shashocompany/aleppocentercash/NativeFileSaverPlugin.java <<'EOF'\n          package com.shashocompany.aleppocentercash;\n\n          import android.content.ContentValues;\n          import android.net.Uri;\n          import android.os.Build;\n          import android.os.Environment;\n          import android.provider.MediaStore;\n          import android.util.Base64;\n\n          import com.getcapacitor.JSObject;\n          import com.getcapacitor.Plugin;\n          import com.getcapacitor.PluginCall;\n          import com.getcapacitor.PluginMethod;\n          import com.getcapacitor.annotation.CapacitorPlugin;\n\n          import java.io.File;\n          import java.io.FileOutputStream;\n          import java.io.OutputStream;\n\n          @CapacitorPlugin(name = "NativeFileSaver")\n          public class NativeFileSaverPlugin extends Plugin {\n            @PluginMethod\n            public void savePdf(PluginCall call) {\n              String filename = call.getString("filename");\n              String base64 = call.getString("base64");\n              if (filename == null || filename.trim().isEmpty() || base64 == null || base64.isEmpty()) {\n                call.reject("اسم الملف أو بيانات PDF غير صالحة");\n                return;\n              }\n\n              try {\n                byte[] bytes = Base64.decode(base64, Base64.DEFAULT);\n                Uri uri;\n\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n                  ContentValues values = new ContentValues();\n                  values.put(MediaStore.Downloads.DISPLAY_NAME, filename);\n                  values.put(MediaStore.Downloads.MIME_TYPE, "application/pdf");\n                  values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Aleppo Center Cash");\n                  values.put(MediaStore.Downloads.IS_PENDING, 1);\n\n                  uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);\n                  if (uri == null) throw new IllegalStateException("تعذر إنشاء ملف في التنزيلات");\n\n                  try (OutputStream output = getContext().getContentResolver().openOutputStream(uri)) {\n                    if (output == null) throw new IllegalStateException("تعذر فتح ملف التنزيلات");\n                    output.write(bytes);\n                    output.flush();\n                  }\n\n                  ContentValues published = new ContentValues();\n                  published.put(MediaStore.Downloads.IS_PENDING, 0);\n                  getContext().getContentResolver().update(uri, published, null, null);\n                } else {\n                  File downloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);\n                  File folder = new File(downloads, "Aleppo Center Cash");\n                  if (!folder.exists() && !folder.mkdirs()) throw new IllegalStateException("تعذر إنشاء مجلد التنزيلات");\n                  File target = new File(folder, filename);\n                  try (FileOutputStream output = new FileOutputStream(target)) {\n                    output.write(bytes);\n                    output.flush();\n                  }\n                  uri = Uri.fromFile(target);\n                }\n\n                JSObject result = new JSObject();\n                result.put("uri", uri.toString());\n                call.resolve(result);\n              } catch (Exception error) {\n                call.reject("تعذر حفظ الفاتورة في التنزيلات", error);\n              }\n            }\n          }\n          EOF\n\n          MAIN=app/src/main/java/com/shashocompany/aleppocentercash/MainActivity.java\n          python3 - <<'PY'\n          from pathlib import Path\n          p = Path("app/src/main/java/com/shashocompany/aleppocentercash/MainActivity.java")\n          s = p.read_text()\n          if "NativeFileSaverPlugin" not in s:\n              s = s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\\nimport android.os.Bundle;\\n")\n              s = s.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\\n    @Override\\n    public void onCreate(Bundle savedInstanceState) {\\n        super.onCreate(savedInstanceState);\\n        registerPlugin(NativeFileSaverPlugin.class);\\n    }\\n")\n              p.write_text(s)\n          PY\n\n          grep -q "NativeFileSaverPlugin" "$MAIN"\n\n      - name: Configure Firebase FCM
        working-directory: android
        run: |
          cp ../google-services.json app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          app = Path("app/build.gradle")
          root_text = root.read_text()
          app_text = app.read_text()

          if "com.google.gms:google-services" not in root_text:
              root_text = (
                  "buildscript {\n"
                  "    repositories { google(); mavenCentral() }\n"
                  "    dependencies { classpath 'com.google.gms:google-services:4.4.2' }\n"
                  "}\n\n"
                  + root_text
              )
              root.write_text(root_text)

          if "com.google.gms.google-services" not in app_text:
              if "plugins {" in app_text:
                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )
              else:
                  app_text = "apply plugin: 'com.google.gms.google-services'\n" + app_text

          if "firebase-messaging" not in app_text:
              pos = app_text.find("dependencies {")
              if pos < 0:
                  raise SystemExit("App Gradle dependencies block not found")
              pos += len("dependencies {")
              app_text = app_text[:pos] + "\n    implementation 'com.google.firebase:firebase-messaging:24.0.1'" + app_text[pos:]

          run_number = __import__("os").environ.get("GITHUB_RUN_NUMBER", "5")
          app_text = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', app_text, count=1)
          app_text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_number}"', app_text, count=1)
          app.write_text(app_text)
          PY

      - name: Install Aleppo Center Cash logo as Android launcher icon
        working-directory: android
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick
          logo="../grok_1790774221995.jpg"
          test -f "$logo"
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert "$logo" -auto-orient -strip -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          # Capacitor creates adaptive-icon XML resources that can override the
          # density-specific PNGs above on Android 8+. Remove those overrides so
          # the launcher uses the exact repository JPG converted above.
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_background.xml

      - name: Verify exact logo source and launcher icons
        working-directory: android
        run: |
          set -e
          test -f ../grok_1790774221995.jpg
          identify ../grok_1790774221995.jpg
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            icon="app/src/main/res/mipmap-${density}/ic_launcher.png"
            test -f "$icon"
            identify "$icon"
            actual="$(identify -format '%wx%h' "$icon")"
            test "$actual" = "${size}x${size}"
          done
          test ! -e app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Verify Capacitor Android project
        run: test -f android/gradlew && test -d android/app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create CI signing key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -alias aleppo-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Aleppo Center Cash, OU=Mobile, O=Aleppo Center Cash, C=SY"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Zipalign and sign release APK
        working-directory: android
        run: |
          set -e
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$APKSIGNER" sign --ks ci-release.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias aleppo-release --out app-release.apk app-release-aligned.apk
          "$APKSIGNER" verify --verbose app-release.apk

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: aleppo-center-cash-release-apk
          path: android/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aleppo Center Cash v1.0.${{ github.run_number }}
          generate_release_notes: false
          make_latest: true
          files: android/app-release.apk
