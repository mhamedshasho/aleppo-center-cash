name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Initialize Capacitor
        run: pnpm exec cap init "Aleppo Center Cash" "com.shashocompany.aleppocentercash" --web-dir dist/public

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Configure Firebase FCM and Android push
        working-directory: android
        run: |
          cp ../google-services.json app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build.gradle")
          app = Path("app/build.gradle")
          root_text = root.read_text()
          app_text = app.read_text()

          # Configure Google Services in whichever Gradle template Capacitor generated.
          if "com.google.gms:google-services" not in root_text and "com.google.gms.google-services" not in root_text:
              if "buildscript {" in root_text:
                  pos = root_text.find("dependencies {", root_text.find("buildscript {"))
                  if pos < 0:
                      raise SystemExit("Gradle buildscript dependencies block not found")
                  pos += len("dependencies {")
                  root_text = root_text[:pos] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[pos:]
              elif "plugins {" in root_text:
                  root_text = root_text.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                      1,
                  )
              else:
                  raise SystemExit("No supported root Gradle configuration found")
              root.write_text(root_text)

          if "com.google.gms.google-services" not in app_text:
              if "plugins {" in app_text:
                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )
              else:
                  app_text = "apply plugin: 'com.google.gms.google-services'\n" + app_text

          # Ensure Firebase Messaging is present for FCM token registration.
          if "firebase-messaging" not in app_text:
              if "dependencies {" not in app_text:
                  raise SystemExit("App Gradle dependencies block not found")
              pos = app_text.find("dependencies {") + len("dependencies {")
              app_text = app_text[:pos] + "\n    implementation 'com.google.firebase:firebase-messaging:24.0.1'" + app_text[pos:]

          # Give this APK an explicit version so every push-fix build is distinguishable.
          import re
          app_text = re.sub(r'versionCode\s+\d+', 'versionCode 2', app_text, count=1)
          app_text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.2"', app_text, count=1)

          app.write_text(app_text)
          print("Firebase FCM + Google Services + Firebase Messaging configured")
          PY

      - name: Verify Capacitor Android project
        run: test -f android/gradlew && test -d android/app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aleppo-center-cash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
