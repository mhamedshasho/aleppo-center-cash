name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Initialize Capacitor
        run: pnpm exec cap init "Aleppo Center Cash" "com.shashocompany.aleppocentercash" --web-dir dist/public

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Configure Firebase FCM
        working-directory: android
        run: |
          cp ../google-services.json app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          app = Path("app/build.gradle")
          root_text = root.read_text()
          app_text = app.read_text()

          if "com.google.gms:google-services" not in root_text:
              root_text = (
                  "buildscript {\n"
                  "    repositories { google(); mavenCentral() }\n"
                  "    dependencies { classpath 'com.google.gms:google-services:4.4.2' }\n"
                  "}\n\n"
                  + root_text
              )
              root.write_text(root_text)

          if "com.google.gms.google-services" not in app_text:
              if "plugins {" in app_text:
                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )
              else:
                  app_text = "apply plugin: 'com.google.gms.google-services'\n" + app_text

          if "firebase-messaging" not in app_text:
              pos = app_text.find("dependencies {")
              if pos < 0:
                  raise SystemExit("App Gradle dependencies block not found")
              pos += len("dependencies {")
              app_text = app_text[:pos] + "\n    implementation 'com.google.firebase:firebase-messaging:24.0.1'" + app_text[pos:]

          run_number = __import__("os").environ.get("GITHUB_RUN_NUMBER", "5")
          app_text = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', app_text, count=1)
          app_text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_number}"', app_text, count=1)
          app.write_text(app_text)
          PY

      - name: Install Aleppo Center Cash logo as Android launcher icon
        working-directory: android
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick
          logo="../client/public/logo-exact.svg"
          test -f "$logo"
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert "$logo" -auto-orient -strip -resize "${size}x${size}" -background white -gravity center -extent "${size}x${size}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Verify Capacitor Android project
        run: test -f android/gradlew && test -d android/app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create CI signing key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -alias aleppo-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Aleppo Center Cash, OU=Mobile, O=Aleppo Center Cash, C=SY"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Zipalign and sign release APK
        working-directory: android
        run: |
          set -e
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$APKSIGNER" sign --ks ci-release.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias aleppo-release --out app-release.apk app-release-aligned.apk
          "$APKSIGNER" verify --verbose app-release.apk

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: aleppo-center-cash-release-apk
          path: android/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aleppo Center Cash v1.0.${{ github.run_number }}
          generate_release_notes: false
          make_latest: true
          files: android/app-release.apk
