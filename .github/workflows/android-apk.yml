name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Initialize Capacitor
        run: pnpm exec cap init "Aleppo Center Cash" "com.shashocompany.aleppocentercash" --web-dir dist/public

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Configure Firebase FCM and Android push
        working-directory: android
        run: |
          cp ../google-services.json app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build.gradle")
          app = Path("app/build.gradle")

          root_text = root.read_text()
          app_text = app.read_text()

          # Capacitor 7 uses the Gradle plugins DSL. Add Google Services
          # to the existing root plugins block so Gradle accepts it.
          if "com.google.gms.google-services" not in root_text:
              if "plugins {" not in root_text:
                  raise SystemExit("Root Gradle plugins block not found")
              root_text = root_text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                  1,
              )
              root.write_text(root_text)

          if "com.google.gms.google-services" not in app_text:
              if "plugins {" not in app_text:
                  raise SystemExit("App Gradle plugins block not found")
              app_text = app_text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1,
              )
              app.write_text(app_text)

          print("Firebase Google Services Gradle plugin configured")
          PY

      - name: Verify Capacitor Android project
        run: test -f android/gradlew && test -d android/app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aleppo-center-cash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
