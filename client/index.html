<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#173f47" />
    <meta name="description" content="Aleppo Center Cash — A Redro Product" />
    <link rel="icon" href="/redro-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/redro-mark.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/redro-mark.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Aleppo Center Cash | A Redro Product</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <style id="redro-install-style">#redro-install-bar{position:fixed;z-index:2147483000;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;padding:12px 14px;background:#17171f;color:#fff;border:1px solid #393943;border-radius:16px;box-shadow:0 12px 40px #0007;font:600 14px system-ui;direction:rtl}#redro-install-bar[hidden]{display:none}#redro-install-bar .ri-copy{flex:1;line-height:1.5}#redro-install-bar button{border:0;border-radius:10px;padding:10px 14px;background:#e63243;color:white;font:700 13px system-ui;white-space:nowrap}#redro-install-bar .ri-close{background:#30303a;padding:8px 10px}</style><script id="redro-install-script">(()=>{if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone)return;let deferred=null;const bar=document.createElement('div');bar.id='redro-install-bar';bar.hidden=true;bar.innerHTML='<span class="ri-copy">ثبّت التطبيق على جهازك للوصول إليه بسرعة</span><button type="button" class="ri-action">تثبيت التطبيق</button><button type="button" class="ri-close" aria-label="إغلاق">×</button>';document.body.appendChild(bar);const action=bar.querySelector('.ri-action');const close=()=>bar.hidden=true;bar.querySelector('.ri-close').addEventListener('click',close);const show=()=>{bar.hidden=false};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;action.textContent='تثبيت التطبيق';show()});window.addEventListener('appinstalled',()=>{deferred=null;close()});action.addEventListener('click',async()=>{if(deferred){const prompt=deferred;deferred=null;await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome!=='accepted')show();else close();return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const android=/android/i.test(navigator.userAgent);bar.querySelector('.ri-copy').textContent=ios?'للتثبيت: اضغط مشاركة ثم إضافة إلى الشاشة الرئيسية.':android?'افتح قائمة المتصفح ⋮ ثم اختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية.':'من قائمة المتصفح اختر Install app أو تثبيت التطبيق إذا كان الخيار متاحاً.';action.textContent='فهمت';action.onclick=close});setTimeout(()=>{if(!deferred){bar.querySelector('.ri-copy').textContent='يمكنك تثبيت هذا التطبيق على جهازك من قائمة المتصفح';action.textContent='طريقة التثبيت';show()}},1800)})();</script></body>
</html>
